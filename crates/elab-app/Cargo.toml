[package]
name = "elab-app"
description = "elab – Elektronik-Lernlabor: Schaltplan-Editor mit Live-Simulation"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
default-run = "elab"

[[bin]]
name = "elab"
path = "src/main.rs"

[dependencies]
elab-sim = { path = "../elab-sim" }
eframe = "0.37.0"
egui = "0.37.0"
egui_plot = "0.38.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.18"
